<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=10.0"/>
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around the U.S</title>
    <link rel="shortcut icon" href="#" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img src="<%=require('../src/images/around-the-us.svg')%>" alt="Around the U.S. Logo" class="header__logo"/>
      </header>
      <main class="content">
        <section class="profile page__section">
          <img src="<%=require('../src/images/Avatar.jpg')%>" alt="Avatar" class="profile__image" />
          <div class="profile__info">
            <div class="profile__info">
            <h1 class="profile__title" id="profile-title">Jacques Cousteau</h1>
            <button type="button" class="profile__edit-button" id="profile-edit-button"></button>
            </div>
            <p class="profile__description" id="profile-description">Explorer</p>
          </div>
          <button type="button" aria-label="Create card" class="profile__add-button"></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">&copy; 2023 Around the U.S.</p>
      </footer>
      </div>
      <!-- Edit modal -->
      <div class="modal" id="profile-edit-modal">
        <div class="modal__container">
          <button class="modal__close" id="profile-modal-close"></button>
          <h3 class="modal__heading">Edit Profile</h3>
          <form class="modal__form" id="profile-edit-form">
            <input 
            type="text" 
            name="name" 
            class="modal__input"
            placeholder="Name"
            id="profile-name"
            minlength="2"
            maxlength="40"
            required
            >
            <span class="modal__error" id="profile-name-error"></span>
            <input 
            type="text" 
            name="about" 
            class="modal__input" 
            placeholder="About"
            id="profile-about"
            minlength="2"
            maxlength="200"
            required
            >
            <span class="modal__error" id="profile-about-error"></span>
            <button class="modal__button modal__button_disabled" type="submit" disabled>Save</button>
          </form>
        </div>
      </div>
      <!-- Add card modal -->
      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <button class="modal__close" id="modal-card-close"></button>
          <h3 class="modal__heading">New Place</h3>
          <form class="modal__form" id="add-card-form">
            <input 
            type="text" 
            name="card__title" 
            class="modal__input"
            placeholder="Title"
            id="card-input-title"
            minlength="1"
            maxlength="30"
            required
            >
            <span class="modal__error" id="card-name-error"></span>
            <input 
            type="url" 
            name="card__url" 
            class="modal__input" 
            placeholder="Image link"
            id="card-input-about"
            required
            >
            <span class="modal__error" id="card-about-error"></span>
            <button class="modal__button modal__button_disabled" type="submit" disabled>Save</button>
          </form>
        </div>
      </div>
      <!-- Preview image modal -->
      <div class="modal" id="preview-image">
        <div class="modal__container modal__preview_container">
          <button class="modal__button" id="open-preview-close"></button>
          <img src="" alt="" class="modal__image" id="modal-preview-image"/>
          <h3 class="preview__description"></h3>
        </div>
      </div>
      <!-- Delete button modal -->
      <div class="modal" id="delete-modal">
        <div class="modal__container">
          <button class="modal__close" id="delete-picture-close"></button>
          <h3 class="modal__heading">Are you sure?</h3>
          <form class="modal__form" id="modal-form"></form>
            <button class="modal__button" id="delete-picture-submit" type="submit">Yes</button>
          </form>
        </div>
      </div>
      <!-- Update Profile Picture -->
      <div class="modal" id="profile-picture-modal">
        <div class="modal__container">
          <button class="modal__close" type="button" id="picture-edit-close"></button>
          <h2 class="modal__heading">Change Profile Picture</h2>
          <form class="modal__form" id="avatar-form">
            <input 
            type="url"
            name="profile__url"
            class="modal__input"
            placeholder="Image link"
            id="profile-input-url"
            required
            />
            <span class="modal__error" id="profile-input-url-error"></span>
            <button class="modal__button" type="submit">Save</button>
          </form>
        </div>
      </div>
      <template id="card-template">
        <li class="card">
          <img src="" alt="" class="card__image" />
          <button class="card__delete-button" type="button"></button>
          <div class="card__description">
            <h2 class="card__title"></h2>
            <button type="button" class="card__like-button"></button>
          </div>
        </li>
      </template>
    </body>
</html>
